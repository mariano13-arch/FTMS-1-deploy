name: ftms

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ftms}
      POSTGRES_USER: ${POSTGRES_USER:-ftms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ftms} -d ${POSTGRES_DB:-ftms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.0
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"

  backend:
    build: ./backend
    environment: &backend-environment
      DATABASE_URL: ${DATABASE_URL:-postgis://ftms:local-development-only@db:5432/ftms}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Manila}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-false}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-false}
      FTMS_SESSION_IDLE_TIMEOUT_SECONDS: ${FTMS_SESSION_IDLE_TIMEOUT_SECONDS:-43200}
      FTMS_SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${FTMS_SESSION_ABSOLUTE_TIMEOUT_SECONDS:-86400}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-localhost}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-25}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-false}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-webmaster@localhost}
      DRIVER_MOBILE_ACCOUNT_SETUP_URL: ${DRIVER_MOBILE_ACCOUNT_SETUP_URL:-ftms-driver://setup-password}
      STAFF_ACCOUNT_SETUP_URL: ${STAFF_ACCOUNT_SETUP_URL:-http://localhost:5173/setup-staff-password}
      STAFF_PASSWORD_RESET_URL: ${STAFF_PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      DJANGO_PASSWORD_RESET_TIMEOUT: ${DJANGO_PASSWORD_RESET_TIMEOUT:-3600}
      DJANGO_PASSWORD_RESET_THROTTLE: ${DJANGO_PASSWORD_RESET_THROTTLE:-5/hour}
      DJANGO_PASSWORD_RESET_COMPLETION_THROTTLE: ${DJANGO_PASSWORD_RESET_COMPLETION_THROTTLE:-10/hour}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      DRIVER_MOBILE_APP_DOWNLOAD_URL: ${DRIVER_MOBILE_APP_DOWNLOAD_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      TOMTOM_MATRIX_API_KEY: ${TOMTOM_MATRIX_API_KEY:-${TOMTOM_API_KEY:-}}
      TOMTOM_SEARCH_API_KEY: ${TOMTOM_SEARCH_API_KEY:-${VITE_TOMTOM_MAPS_KEY:-}}
      FLIGHTRADAR24_API_TOKEN: ${FLIGHTRADAR24_API_TOKEN:-}
      AIRPORT_PASSENGER_READY_ALLOWANCE_MINUTES: ${AIRPORT_PASSENGER_READY_ALLOWANCE_MINUTES:-}
      DISPATCH_OPERATIONAL_BUFFER_MINUTES: ${DISPATCH_OPERATIONAL_BUFFER_MINUTES:-}
      DISPATCH_TELEMETRY_MAX_AGE_SECONDS: ${DISPATCH_TELEMETRY_MAX_AGE_SECONDS:-300}
      DISPATCH_SIMULATED_TELEMETRY_MAX_AGE_SECONDS: ${DISPATCH_SIMULATED_TELEMETRY_MAX_AGE_SECONDS:-86400}
      FTMS_TELEMETRY_CLOCK_SKEW_SECONDS: ${FTMS_TELEMETRY_CLOCK_SKEW_SECONDS:-300}
      FTMS_DEMO_TELEMETRY_ENABLED: ${FTMS_DEMO_TELEMETRY_ENABLED:-false}
      FTMS_DEMO_TELEMETRY_CENTER_LATITUDE: ${FTMS_DEMO_TELEMETRY_CENTER_LATITUDE:-}
      FTMS_DEMO_TELEMETRY_CENTER_LONGITUDE: ${FTMS_DEMO_TELEMETRY_CENTER_LONGITUDE:-}
      FTMS_DEMO_TELEMETRY_RADIUS_METERS: ${FTMS_DEMO_TELEMETRY_RADIUS_METERS:-1500}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-ftms/v1/telemetry}
      MQTT_QOS: ${MQTT_QOS:-1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/health/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  celery:
    build: ./backend
    command: celery -A config worker --loglevel=info
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  mqtt-ingestor:
    build: ./backend
    command: python manage.py run_mqtt_ingestor
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
      VITE_TOMTOM_MAPS_KEY: ${VITE_TOMTOM_MAPS_KEY:-}
      VITE_SESSION_IDLE_TIMEOUT_SECONDS: ${VITE_SESSION_IDLE_TIMEOUT_SECONDS:-43200}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
